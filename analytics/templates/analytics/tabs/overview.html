<div class="analytics-overview-tab">
    <div class="row" id="overview-kpi-cards">
        <div class="col-12 text-center py-5">
            <div class="analytics-spinner">
                <div class="spinner-border text-primary" role="status"></div>
                <span class="ms-3">Loading overview metrics...</span>
            </div>
        </div>
    </div>
    <div class="row mt-4">
        <div class="col-lg-6 mb-4">
            <div class="analytics-chart-card">
                <div class="chart-card-header">Revenue Trend <span class="analytics-info-icon" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Shows how revenue changes over time for the selected date range.">ⓘ</span></div>
                <div id="overview-revenue-chart" class="analytics-chart"></div>
            </div>
        </div>
        <div class="col-lg-6 mb-4">
            <div class="analytics-chart-card">
                <div class="chart-card-header">Overview Breakdown <span class="analytics-info-icon" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Distribution of inventory value, receivables and payables as a percentage of total business value.">ⓘ</span></div>
                <div id="overview-breakdown-chart" class="analytics-chart"></div>
            </div>
        </div>
    </div>
</div>
