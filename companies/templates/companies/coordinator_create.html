{% extends "store/base.html" %}
{% load crispy_forms_tags %}
{% block title %}Create Coordinator{% endblock %}
{% block content %}
<div class="container py-4 col-md-7">
    <h2>Create Coordinator</h2>
    <form method="post">{% csrf_token %}{{ form|crispy }}
        <button type="submit" class="btn btn-primary">Create</button>
        <a href="{% url 'coordinator-list' %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
