<div class="row g-4">
    <div class="col-lg-6 col-md-12">
        <div class="chart-card h-100">
            <div class="chart-card-header">
                <div>
                    <h5 class="chart-title mb-1">Purchase Analytics</h5>
                    <p class="chart-subtitle mb-0">Purchase activity over time</p>
                </div>
            </div>

            <div class="chart-wrapper line-wrapper">
                <canvas id="purchaseChart"></canvas>
            </div>
        </div>
    </div>

    <div class="col-lg-6 col-md-12">
        <div class="chart-card h-100">
            <div class="chart-card-header">
                <div>
                    <h5 class="chart-title mb-1">Sales Analytics</h5>
                    <p class="chart-subtitle mb-0">Sales performance over time</p>
                </div>
            </div>

            <div class="chart-wrapper line-wrapper">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const salesLabels = {{ sale_dates_labels|safe|default:"[]" }};
    const salesValues = {{ sale_dates_values|safe|default:"[]" }};

    const purchaseLabels = {{ purchase_dates_labels|safe|default:"[]" }};
    const purchaseValues = {{ purchase_dates_values|safe|default:"[]" }};

    const purchaseCanvas = document.getElementById('purchaseChart');
    const lineCanvas = document.getElementById('lineChart');

    if (purchaseCanvas) {
        const existingPurchaseChart = Chart.getChart(purchaseCanvas);

        if (existingPurchaseChart) {
            existingPurchaseChart.destroy();
        }

        const purchaseCtx = purchaseCanvas.getContext('2d');
        const purchaseGradient = purchaseCtx.createLinearGradient(0, 0, 0, 360);
        purchaseGradient.addColorStop(0, 'rgba(34, 197, 94, 0.30)');
        purchaseGradient.addColorStop(1, 'rgba(34, 197, 94, 0.02)');

        new Chart(purchaseCtx, {
            type: 'line',
            data: {
                labels: purchaseLabels,
                datasets: [{
                    label: 'Purchases',
                    data: purchaseValues,
                    borderColor: '#22c55e',
                    backgroundColor: purchaseGradient,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#22c55e',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    borderWidth: 3,
                    tension: 0.35,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: '#111827',
                        titleColor: '#ffffff',
                        bodyColor: '#ffffff',
                        padding: 10,
                        callbacks: {
                            label: function(context) {
                                return 'Purchases: ' + context.raw;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: true,
                            color: '#f0f1f6',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#9ca3af',
                            font: {
                                size: 11,
                                weight: '500'
                            }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#f0f1f6',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#9ca3af',
                            font: {
                                size: 11,
                                weight: '500'
                            }
                        }
                    }
                }
            }
        });
    }

    if (lineCanvas) {
        const existingLineChart = Chart.getChart(lineCanvas);

        if (existingLineChart) {
            existingLineChart.destroy();
        }

        const lineCtx = lineCanvas.getContext('2d');
        const salesGradient = lineCtx.createLinearGradient(0, 0, 0, 360);
        salesGradient.addColorStop(0, 'rgba(91, 92, 226, 0.30)');
        salesGradient.addColorStop(1, 'rgba(91, 92, 226, 0.02)');

        new Chart(lineCtx, {
            type: 'line',
            data: {
                labels: salesLabels,
                datasets: [{
                    label: 'Sales',
                    data: salesValues,
                    borderColor: '#5b5ce2',
                    backgroundColor: salesGradient,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#5b5ce2',
                    pointBorderWidth: 2,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                    borderWidth: 3,
                    tension: 0.35,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: '#111827',
                        titleColor: '#ffffff',
                        bodyColor: '#ffffff',
                        padding: 10,
                        callbacks: {
                            label: function(context) {
                                return 'Sales: ' + context.raw;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: true,
                            color: '#f0f1f6',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#9ca3af',
                            font: {
                                size: 11,
                                weight: '500'
                            }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#f0f1f6',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#9ca3af',
                            font: {
                                size: 11,
                                weight: '500'
                            }
                        }
                    }
                }
            }
        });
    }
</script>
<style>
    .chart-card {
        background: #fbfbfd;
        border: 1px solid #f0f1f6;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.04);
        padding: 22px;
    }

    .chart-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
    }

    .chart-title {
        color: #2b2f42;
        font-size: 1rem;
        font-weight: 700;
    }

    .chart-subtitle {
        color: #9ca3af;
        font-size: 0.86rem;
        font-weight: 500;
    }

    .chart-wrapper {
        position: relative;
        width: 100%;
    }

    .line-wrapper {
        height: 360px;
    }

    #purchaseChart,
    #lineChart {
        width: 100% !important;
        height: 100% !important;
    }
</style>
