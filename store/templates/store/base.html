<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}

    <title>IMS: {% block title %}{% endblock title %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}?v=20">
    <link rel="icon" href="{% static 'images/logo/favicon.png' %}" type="image/png">

    {% block stylesheets %}{% endblock stylesheets %}
</head>

<body class="sidebar-collapsed">

    {% include "store/sidebar.html" %}

    <section id="wrapper">
        <nav class="navbar navbar-expand-md bg-success">
            <div class="container-fluid mx-2">
                <div class="navbar-header d-flex align-items-center">
                    <button class="navbar-toggler me-2 d-block" type="button" id="sidebarToggleBtn">
                        <i class="fa fa-bars text-white"></i>
                    </button>

                    <a class="navbar-brand text-white" style="font-size: 20px;" href="{% url 'dashboard' %}">
                        INVENTOIR
                    </a>
                </div>

                <div class="collapse navbar-collapse" id="toggle-navbar">
                    <ul class="navbar-nav ms-auto">
                    </ul>
                </div>
            </div>
        </nav>

        <div class="page-content">
            {% include "store/includes/messages.html" %}

            {% block content %}
            {% endblock content %}
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}?v=20"></script>

    {% block javascripts %}{% endblock javascripts %}
</body>
</html>
