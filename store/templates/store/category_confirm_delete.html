{% extends 'store/base.html' %}

{% block content %}
<div class="container-fluid py-4" style="background: #f5f6fa; min-height: 100vh;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">
                <div class="mb-4">
                    <h3 class="fw-bold mb-1" style="color: #1a1c8f;">
                        <i class="fas fa-trash-alt me-2"></i>Delete Category
                    </h3>
                    <p class="text-muted mb-0" style="font-size: 0.92rem;">
                        This action will permanently remove the selected category.
                    </p>
                </div>

                <div class="p-3 mb-4" style="background: #fff7ed; border: 1px solid #fed7aa; border-radius: 14px;">
                    <div class="d-flex align-items-start">
                        <i class="fas fa-exclamation-triangle me-3 mt-1" style="color: #ea580c;"></i>
                        <div>
                            <div class="fw-semibold" style="color: #9a3412;">Are you sure?</div>
                            <div style="color: #7c2d12; font-size: 0.95rem;">
                                You are about to delete
                                <span class="fw-bold">"{{ category.name }}"</span>.
                            </div>
                        </div>
                    </div>
                </div>

                <style>
                    .danger-btn {
                        background-color: #dc2626;
                        border: none;
                        border-radius: 12px;
                        font-weight: 600;
                        color: white;
                        padding: 10px 20px;
                        transition: all 0.25s ease;
                    }

                    .danger-btn:hover {
                        background-color: #b91c1c;
                        transform: translateY(-1px);
                        box-shadow: 0 6px 16px rgba(220, 38, 38, 0.18);
                        color: white;
                    }

                    .secondary-btn {
                        border-radius: 12px;
                        font-weight: 600;
                        padding: 10px 20px;
                    }
                </style>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <a href="{% url 'category-list' %}" class="btn btn-outline-secondary secondary-btn">
                            <i class="fas fa-arrow-left me-1"></i> Cancel
                        </a>

                        <button type="submit" class="btn danger-btn">
                            <i class="fas fa-check me-1"></i> Confirm Delete
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
