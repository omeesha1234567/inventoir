{% extends 'store/base.html' %}

{% block content %}
<div class="container-fluid py-4" style="background: #f5f6fa; min-height: 100vh;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm p-4" style="border-radius: 20px;">

                <!-- Header -->
                <div class="mb-4">
                    <h3 class="fw-bold mb-1" style="color: #1a1c8f;">
                        <i class="fas fa-tag me-2"></i>{{ category.name }}
                    </h3>
                    <p class="text-muted mb-0" style="font-size: 0.9rem;">
                        Category details and information
                    </p>
                </div>

                <!-- Info Block -->
                <div class="p-3 mb-4" style="background: #f8fafc; border-radius: 14px;">
                    <div class="mb-2">
                        <span class="text-muted small fw-semibold">Slug</span>
                        <div class="fw-semibold" style="color: #374151;">
                            {{ category.slug }}
                        </div>
                    </div>
                </div>

                <!-- Styles -->
                <style>
                    .primary-btn {
                        background-color: #1a1c8f;
                        border: none;
                        border-radius: 12px;
                        font-weight: 600;
                        color: white;
                        padding: 10px 18px;
                        transition: all 0.25s ease;
                    }

                    .primary-btn:hover {
                        background-color: #151774;
                        transform: translateY(-1px);
                        box-shadow: 0 6px 16px rgba(26, 28, 143, 0.2);
                        color: white;
                    }

                    .danger-btn {
                        background-color: #dc2626;
                        border: none;
                        border-radius: 12px;
                        font-weight: 600;
                        color: white;
                        padding: 10px 18px;
                        transition: all 0.25s ease;
                    }

                    .danger-btn:hover {
                        background-color: #b91c1c;
                        transform: translateY(-1px);
                        box-shadow: 0 6px 16px rgba(220, 38, 38, 0.2);
                        color: white;
                    }

                    .secondary-btn {
                        border-radius: 12px;
                        font-weight: 600;
                        padding: 10px 18px;
                    }
                </style>

                <!-- Actions -->
                <div class="d-flex justify-content-between flex-wrap gap-2">

                    <a href="{% url 'category-list' %}" class="btn btn-outline-secondary secondary-btn">
                        <i class="fas fa-arrow-left me-1"></i> Back
                    </a>

                    <div class="d-flex gap-2">
                        <a href="{% url 'category-update' category.pk %}" class="btn primary-btn">
                            <i class="fas fa-edit me-1"></i> Edit
                        </a>

                        <a href="{% url 'category-delete' category.pk %}" class="btn danger-btn">
                            <i class="fas fa-trash-alt me-1"></i> Delete
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
