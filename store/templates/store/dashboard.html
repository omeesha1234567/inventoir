{% extends "store/base.html" %}
{% load static %}

{% block title %}Dashboard{% endblock title %}

{% block content %}
<div class="container-fluid py-4">
    <style>
        .dashboard-page {
            background: linear-gradient(180deg, #f8f9ff 0%, #ffffff 100%);
            min-height: 100vh;
        }

        .dashboard-title {
            color: #010102;
            font-weight: 700;
            font-size: 2rem;
        }

        .dashboard-link {
            text-decoration: none;
        }

        .dashboard-card {
            border: none;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(17, 24, 39, 0.05);
            transition: 0.25s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(26, 28, 143, 0.08);
        }

        .dashboard-label {
            color: #060607;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .dashboard-value {
            color: #111827;
            font-size: 2rem;
            font-weight: 700;
        }

        .dashboard-icon {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: rgba(26, 28, 143, 0.1);
            color: #1a1c8f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .dashboard-section {
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(17, 24, 39, 0.05);
            padding: 18px;
        }
    </style>

    <div class="dashboard-page p-3 p-md-4">

        <div class="mb-4">
            <h2 class="dashboard-title mb-1">Dashboard</h2>
        </div>

        <div class="row g-4 mb-4">

            <div class="col-xl-3 col-sm-6 col-12">
                <a href="{% url 'productslist' %}" class="dashboard-link">
                    <div class="card dashboard-card">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <span class="dashboard-label">Products</span>
                                    <div class="dashboard-value">{{ total_items }}</div>
                                </div>
                                <div class="dashboard-icon">
                                    <i class="fa fa-clipboard-list"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-xl-3 col-sm-6 col-12">
                <a href="{% url 'category-list' %}" class="dashboard-link">
                    <div class="card dashboard-card">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <span class="dashboard-label">Categories</span>
                                    <div class="dashboard-value">{{ total_categories }}</div>
                                </div>
                                <div class="dashboard-icon">
                                    <i class="fa fa-tags"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-xl-3 col-sm-6 col-12">
                <a href="{% url 'profile_list' %}" class="dashboard-link">
                    <div class="card dashboard-card">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <span class="dashboard-label">Staff</span>
                                    <div class="dashboard-value">{{ profiles_count }}</div>
                                </div>
                                <div class="dashboard-icon">
                                    <i class="fa fa-users"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-xl-3 col-sm-6 col-12">
                <a href="{% url 'saleslist' %}" class="dashboard-link">
                    <div class="card dashboard-card">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <span class="dashboard-label">Sales</span>
                                    <div class="dashboard-value">{{ sales_count }}</div>
                                </div>
                                <div class="dashboard-icon">
                                    <i class="fa fa-shopping-bag"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

        </div>

        <div class="dashboard-section">
            {% include 'store/charts.html' %}
        </div>

    </div>
</div>
{% endblock content %}
