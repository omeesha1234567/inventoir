{% extends "store/base.html" %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="container-fluid py-4" style="background: #f5f6fa; min-height: 100vh;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card border-0 shadow-sm" style="border-radius: 22px; overflow: hidden;">
                <div style="height: 6px; background: #dc2626;"></div>

                <div class="card-body p-4 p-md-5">
                    <div class="mb-4 text-center">
                        <div class="d-inline-flex align-items-center justify-content-center mb-3"
                             style="width: 60px; height: 60px; border-radius: 16px; background: rgba(220, 38, 38, 0.10); color: #dc2626;">
                            <i class="fas fa-trash-alt" style="font-size: 1.3rem;"></i>
                        </div>

                        <h3 class="fw-bold mb-1" style="color: #1f2937;">
                            Delete Purchase
                        </h3>

                        <p class="mb-0" style="color: #6b7280; font-size: 0.95rem;">
                            This will remove the whole grouped purchase entry
                        </p>
                    </div>

                    <div class="p-3 mb-4"
                         style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 14px;">
                        <div class="d-flex align-items-start">
                            <i class="fas fa-exclamation-triangle me-3 mt-1" style="color: #dc2626;"></i>
                            <div>
                                <div class="fw-semibold" style="color: #991b1b;">Are you sure?</div>
                                <div style="color: #7f1d1d; font-size: 0.95rem;">
                                    You are about to delete purchase batch
                                    <span class="fw-bold">"#{{ object.id }}"</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <style>
                        .danger-btn {
                            background-color: #dc2626;
                            border: none;
                            border-radius: 12px;
                            font-weight: 600;
                            color: white;
                            padding: 11px 22px;
                            transition: all 0.25s ease;
                        }

                        .danger-btn:hover {
                            background-color: #b91c1c;
                            transform: translateY(-1px);
                            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.2);
                            color: white;
                        }

                        .cancel-btn {
                            border-radius: 12px;
                            font-weight: 600;
                            padding: 11px 20px;
                        }
                    </style>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <a class="btn btn-outline-secondary cancel-btn"
                               href="{% url 'purchaseslist' %}">
                                <i class="fas fa-arrow-left me-1"></i> Cancel
                            </a>

                            <button class="btn danger-btn" type="submit">
                                <i class="fas fa-trash me-1"></i> Confirm Delete
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
