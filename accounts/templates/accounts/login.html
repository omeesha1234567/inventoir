{% load crispy_forms_tags %}{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | INVENTOIR</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-indigo: #2224b5;
            --soft-bg: #F4F7F9;
            --text-dark: #1A202C;
            --text-muted: #718096;
        }

        body {
            background: linear-gradient(135deg, #F0F2FF 0%, #F4F7F9 100%);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .login-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 420px;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-8px);
        }

        .brand-text {
            font-size: 34px;
            font-weight: 900; /* Extra bold for impact */
            color: var(--text-dark);
            letter-spacing: -1.5px;
            margin-bottom: 4px;
            text-transform: uppercase; /* Clean professional look */
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 35px;
            font-weight: 500;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
            display: block;
        }

        input {
            width: 100%;
            background-color: #F8F9FA;
            border: 1.5px solid #E9ECEF;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            margin-bottom: 18px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-indigo);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(34, 36, 181, 0.1);
        }

        .btn-submit {
            background-color: var(--primary-indigo);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #1a1c8f;
            box-shadow: 0 12px 25px rgba(34, 36, 181, 0.3);
        }

        .footer-msg {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-msg a {
            color: var(--primary-indigo);
            text-decoration: none;
            font-weight: 700;
        }

        .alert {
            border: none;
            border-radius: 12px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center">
            <div class="brand-text">INVENTOIR</div>
            <p class="subtitle">Management Suite Access</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} py-2 text-center mb-4 shadow-sm">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username"><i class="fa-regular fa-circle-user me-2"></i>Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="id_password"><i class="fa-regular fa-lock-keyhole me-2"></i>Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-submit">
                Sign In
            </button>
        </form>

        <div class="text-center footer-msg">
            Don't have an account? <a href="{% url 'user-register' %}">Register</a>
        </div>
    </div>

</body>
</html>
